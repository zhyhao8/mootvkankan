<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MooTV - 视频网站</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>MooTV</h1>
      <nav>
        <a href="index.html" class="active">首页</a>
        <a href="admin.html">管理员</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h2>热门视频</h2>
        <p>用户无需注册或登录，直接观看视频内容。</p>
      </section>

      <section>
        <h3>视频列表</h3>
        <div id="video-grid" class="video-grid"></div>
      </section>
    </main>

    <template id="video-card-template">
      <article class="video-card">
        <img class="thumb" alt="视频缩略图" />
        <div class="video-body">
          <h4 class="title"></h4>
          <p class="desc"></p>
          <a class="watch-btn" target="_blank" rel="noopener">立即观看</a>
        </div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
